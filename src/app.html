/* ================= NBA logic ================= */
function nbaTier(p){const T=NBA_T;
  if(p<T.cap)return{k:'space',label:'Cap-space team',short:'Under cap'};
  if(p<T.tax)return{k:'over',label:'Over the cap, under the tax',short:'Over cap'};
  if(p<T.a1)return{k:'tax',label:'Luxury-tax payer',short:'Taxpayer'};
  if(p<T.a2)return{k:'a1',label:'Above the first apron',short:'1st apron'};
  return{k:'a2',label:'Above the second apron',short:'2nd apron'};}
function nbaTax(p,rep){const T=NBA_T;let over=p-T.tax;if(over<=0)return{bill:0,rows:[]};
  const base=rep?[3,3.25,5.5,6.75]:[1,1.25,3.5,4.75];let bill=0,i=0,rows=[];
  while(over>1e-9){const rate=i<4?base[i]:base[3]+0.5*(i-3);const amt=Math.min(over,T.bracket);bill+=amt*rate;rows.push([i+1,amt,rate,amt*rate]);over-=amt;i++}
  return{bill,rows};}
function hardCapLine(t){return t.hc.level==='a1'?NBA_T.a1:t.hc.level==='a2'?NBA_T.a2:null}
function nbaCan(p){const T=NBA_T,t=nbaTier(p).k;const yes=[],no=[];
  if(t==='space'){yes.push(`Sign free agents outright into ${fm(T.cap-p)} of cap room`,'Absorb salary in trades into that room',`Use the Room Mid-Level (${fm(T.room,3)}) after spending the room`);no.push('No Non-Taxpayer MLE or Bi-Annual once operating as a room team');}
  if(t==='over'){yes.push(`Non-Taxpayer MLE up to ${fm(T.ntmle,3)} (hard-caps at the 1st apron)`,'Bi-Annual Exception (hard-caps at the 1st apron)','Bird rights to re-sign own free agents over the cap','Trades with expanded salary matching; traded player exceptions','Receives a share of tax money paid by taxpayers');no.push('No cap space for outside free agents beyond exceptions');}
  if(t==='tax'){yes.push(`Full NTMLE only if it stays under the 1st apron ($${T.a1}M)`,'Bird rights, minimum contracts, expanded salary matching (if it stays under the 1st apron)');no.push('Pays luxury tax on every dollar above $'+T.tax+'M','No share of tax distributions','Being in the tax 3 of 4 prior seasons triggers repeater rates');}
  if(t==='a1'){yes.push(`Taxpayer MLE up to ${fm(T.tmle,3)}`,'Bird rights and minimum contracts','Trades taking back up to 100% of outgoing salary');no.push('No sign-and-trade acquisitions','No Bi-Annual or Non-Taxpayer MLE','Can\'t take back more than 100% of outgoing salary','Can\'t use TPEs created in a prior season','Can\'t sign buyout players whose pre-waiver salary exceeded the NTMLE');}
  if(t==='a2'){yes.push('Bird rights and minimum contracts','One-for-one salary-matched trades');no.push('No mid-level exception of any kind','Can\'t aggregate salaries in a trade','Can\'t send cash in trades','First-round pick 7 years out frozen if still over at season\'s end','Every 1st-apron restriction too');}
  return{yes,no};}
function matchAllowed(out){return out<=MATCH.t1?2*out+0.25:out<=MATCH.t2?out+MATCH.t1:1.25*out+0.25}

/* ================= NFL logic ================= */
function nflRead(t){const s=[];const deadPct=t.dead/t.adj*100;
  if(t.space>=25)s.push(`One of the roomiest books in 2026 with ${fm(t.space)} still open; whatever goes unused can roll into 2027.`);
  else if(t.space>=8)s.push(`Moderate 2026 room (${fm(t.space)}): enough for injury replacements, and leftover space can roll forward.`);
  else s.push(`Tight in 2026 with ${fm(t.space)} of space; additions now require moving money.`);
  if(deadPct>=25)s.push(`Dead money is heavy: ${fm(t.dead)} (${deadPct.toFixed(0)}% of its adjusted cap) belongs to players no longer on the roster.`);
  else if(deadPct>=12)s.push(`${fm(t.dead)} in dead money (${deadPct.toFixed(0)}% of adjusted cap) is a meaningful drag.`);
  else s.push(`Dead money is low at ${fm(t.dead)} (${deadPct.toFixed(0)}% of adjusted cap).`);
  if(t.adj-NFL_CAP>8)s.push(`Its adjusted cap of ${fm(t.adj)} is ${fm(t.adj-NFL_CAP)} above the $301.2M base, typically unused 2025 space rolled forward plus league adjustments.`);
  if(t.eff27<0)s.push(`2027 is a squeeze: ${fm(t.space27)} of projected space against a $327M projected cap with ${t.n27} players signed, and ${fm(t.eff27)} once a full roster is counted. Expect restructures, extensions that lower cap hits, or releases before the March 2027 league year.`);
  else if(t.eff27>=50)s.push(`2027 is wide open: ${fm(t.eff27)} of effective space projected, a likely big spender in free agency.`);
  else s.push(`2027 effective space projects at ${fm(t.eff27)} before rollover, workable but not lavish.`);
  return s;}

   <div class="stat"><div class="lab">2027 ${TM('eff_space','effective space')}</div><div class="val ${cls(t.eff27)}">${fm(t.eff27)}</div><div class="sm">${ord(rank27)} of 32 · ${t.n27} signed</div></div>

  <h2>Biggest cap hits</h2><p class="note">The 25 largest 2026 cap numbers on the active roster, plus injured players with $2.5M+ cap hits. Prorated bonus = signing and option bonus money spread over the deal.</p>
  <div class="tablewrap"><table class="tb" id="nflRoster"><thead><tr><th>Player</th><th>Status</th><th>2026 cap hit</th><th>Base salary</th><th>Prorated bonus</th><th>% of cap</th><th>2027 cap hit</th></tr></thead><tbody>

/* ================= TRADE MACHINE ================= */
function viewTrade(){return `<section class="hero"><div class="kicker" style="color:var(--nba)">NBA · 2026-27 rules</div><h1>Trade machine</h1>
  <p class="lede">Pick two teams and the players each sends out. The machine checks salary matching, apron restrictions and hard caps for both sides, and shows how each payroll and tax bill would change.</p></section>
  <div class="grid g2">${['A','B'].map(s=>`<div class="tool"><label>Team ${s}</label><select id="tt${s}">${NBA.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select><div id="info${s}" class="note" style="margin:8px 0"></div><label>Players team ${s} sends out</label><div class="pl" id="pl${s}"></div></div>`).join('')}</div>
  <div id="tradeOut" style="margin-top:16px"></div>
  <details class="gl" style="margin-top:16px"><summary>Rules this machine applies</summary><div class="bd">
  <p><b>Salary matching</b> (for teams over the cap after the trade, below the 1st apron): sending out up to ≈$9.1M lets a team take back 200% + $250K; ≈$9.1M–$35.3M lets it take back outgoing + ≈$9.1M; above that, 125% + $250K.</p>
  <p><b>Apron teams</b>: a team above the 1st apron after the trade can take back no more than 100% of what it sends. A team above the 2nd apron after the trade can't combine two or more salaries.</p>
  <p><b>Hard caps</b>: teams hard-capped from earlier moves can't end up above their apron. Using expanded matching (taking back more than you send) also hard-caps a team at the 1st apron.</p>
  <p><b>Not modeled</b>: traded player exceptions, cash, draft picks, trade bonuses, players who recently signed and can't be traded yet, the two-month aggregation wait after acquiring a player, and the $250K/$100K cap-room cushion. Real deals need league approval.</p></div></details>`;}
function mountTrade(){const sA=$('#ttA'),sB=$('#ttB');sA.value=state.tradeA;sB.value=state.tradeB;
  const fill=s=>{const t=nbaById[s==='A'?state.tradeA:state.tradeB],sel=s==='A'?state.selA:state.selB;
    $('#info'+s).innerHTML=`${fm(t.payroll)} payroll · <span class="chip" style="background:${TIER_COL[nbaTier(t.payroll).k]}">${nbaTier(t.payroll).short}</span>${hardCapLine(t)?` <span class="chip" style="background:#dc2626">Hard cap ${fm(hardCapLine(t),1)}</span>`:''} · <a href="${P(`nba-${t.id.toLowerCase()}`)}">team page</a>`;
    $('#pl'+s).innerHTML=t.p.slice().sort((a,b)=>b[3]-a[3]).map(r=>`<label class="${sel.has(r[0])?'sel':''}"><span><input type="checkbox" data-n="${esc(r[0])}" ${sel.has(r[0])?'checked':''}> ${esc(r[0])}</span><span class="sal">${fm(r[3],2)}</span></label>`).join('');
    $('#pl'+s).querySelectorAll('input').forEach(cb=>cb.onchange=()=>{cb.checked?sel.add(cb.dataset.n):sel.delete(cb.dataset.n);cb.closest('label').classList.toggle('sel',cb.checked);evalTrade()});};
  sA.onchange=()=>{if(sA.value===state.tradeB){sA.value=state.tradeA;return}state.tradeA=sA.value;state.selA=new Set();fill('A');evalTrade()};
  sB.onchange=()=>{if(sB.value===state.tradeA){sB.value=state.tradeB;return}state.tradeB=sB.value;state.selB=new Set();fill('B');evalTrade()};
  fill('A');fill('B');evalTrade();}
function sideCheck(t,outP,inP){const T=NBA_T,out=outP.reduce((a,r)=>a+r[3],0),inn=inP.reduce((a,r)=>a+r[3],0),post=t.payroll-out+inn,issues=[],notes=[];let allowed=null,rule='';
  const hc=hardCapLine(t);
  if(!outP.length&&!inP.length)return null;
  if(post<=T.cap){rule='Ends under the cap: absorbs salary into cap room';}
  else if(post>T.a1){allowed=out;rule='Above the 1st apron after the trade: may take back up to 100% of outgoing';if(inn>out+1e-9)issues.push(`Takes back ${fm(inn,2)} for ${fm(out,2)} out; above the 1st apron that's capped at 100%.`);
    if(post>T.a2&&outP.length>1)issues.push('Above the 2nd apron after the trade, so it can\'t aggregate two or more salaries.');}
  else{allowed=matchAllowed(out);rule=out<=MATCH.t1?'200% + $250K tier':out<=MATCH.t2?'Outgoing + ≈$9.1M tier':'125% + $250K tier';if(inn>allowed+1e-9)issues.push(`Can take back at most ${fm(allowed,2)} for ${fm(out,2)} out; this deal brings back ${fm(inn,2)}.`);
    if(inn>out)notes.push('Using expanded matching hard-caps this team at the 1st apron for the rest of the season.');}
  if(hc&&post>hc+1e-9)issues.push(`Hard-capped at ${fm(hc,3)}; this would put them at ${fm(post,2)}.`);
  const roster=t.p.length-outP.length+inP.length;if(roster>15)issues.push(`Roster would be ${roster} standard contracts (max 15); they'd need to waive someone.`);if(roster<14)notes.push(`Roster drops to ${roster}; they'd have two weeks to get back to 14.`);
  const before=nbaTax(t.payroll,t.rep).bill,after=nbaTax(post,t.rep).bill;
  return{out,inn,post,issues,notes,allowed,rule,before,after,roster};}
function evalTrade(){const A=nbaById[state.tradeA],B=nbaById[state.tradeB];
  const aOut=A.p.filter(r=>state.selA.has(r[0])),bOut=B.p.filter(r=>state.selB.has(r[0]));
  if(!aOut.length&&!bOut.length){$('#tradeOut').innerHTML='<div class="card"><p>Select at least one player on either side to evaluate a trade.</p></div>';return}
  const ra=sideCheck(A,aOut,bOut),rb=sideCheck(B,bOut,aOut);const ok=!ra.issues.length&&!rb.issues.length;
  const side=(t,r,outP,inP)=>{const trB=nbaTier(t.payroll),trA=nbaTier(r.post);return `<div class="card"><h3>${t.name}</h3>
    <table class="brk"><tr><td>Sends out</td><td>${outP.map(p=>esc(p[0])).join(', ')||'—'}</td><td>${fm(r.out,2)}</td></tr><tr><td>Takes back</td><td>${inP.map(p=>esc(p[0])).join(', ')||'—'}</td><td>${fm(r.inn,2)}</td></tr>
    <tr><td>Payroll</td><td>${fm(t.payroll,2)} → <b>${fm(r.post,2)}</b></td><td class="${cls(t.payroll-r.post)}">${fs(r.post-t.payroll,2)}</td></tr>
    <tr><td>Status</td><td colspan="2"><span class="chip" style="background:${TIER_COL[trB.k]}">${trB.short}</span> → <span class="chip" style="background:${TIER_COL[trA.k]}">${trA.short}</span></td></tr>
    <tr><td>Est. tax</td><td colspan="2">${fm(r.before)} → <b>${fm(r.after)}</b> ${r.after!==r.before?`<span class="${r.after<r.before?'pos':'neg'}">(${fs(r.after-r.before)})</span>`:''}</td></tr>
    <tr><td>Rule</td><td colspan="2">${r.rule}${r.allowed!=null?` · max incoming ${fm(r.allowed,2)}`:''}</td></tr></table>
    ${r.issues.map(i=>`<p class="neg">✕ ${i}</p>`).join('')}${r.notes.map(i=>`<p class="note">• ${i}</p>`).join('')}${!r.issues.length?'<p class="pos">✓ Works for this side</p>':''}</div>`};
  $('#tradeOut').innerHTML=`<div class="verdict" style="--c:${ok?'#16a34a':'#dc2626'}"><h3>${ok?'This trade works under the salary rules':'This trade doesn\'t work as built'}</h3><p class="note">${ok?'Both sides satisfy matching, apron and hard-cap checks (rules not modeled are listed below).':'Fix the issues flagged below, for example by adding or removing salary on one side.'}</p></div>
  <div class="grid g2" style="margin-top:12px">${side(A,ra,aOut,bOut)}${side(B,rb,bOut,aOut)}</div>`;}

  const hcTeams=NBA.filter(t=>hardCapLine(t)).map(t=>({...t,room:hardCapLine(t)-t.payroll})).sort((a,b)=>a.room-b.room);
  const exp=NBA.flatMap(t=>t.p.filter(r=>r[4]==null).map(r=>({n:r[0],s:r[3],t,age:r[2]}))).sort((a,b)=>b.s-a.s).slice(0,25);
  const crunch=NFL.slice().sort((a,b)=>a.eff27-b.eff27).slice(0,10);
  return `<section class="hero"><div class="kicker" style="color:var(--nba)">NBA deadline · Thursday, Feb 11, 2027 · 3:00 pm ET</div><h1>Deadline tracker</h1>
  <p class="lede">What's at stake before the NBA trade deadline: who's flirting with the tax line, who's boxed in by a hard cap, and which expiring contracts are likely to move. Plus the NFL's next money deadline.</p></section>
  <div class="count" id="count"></div>

    <div class="card"><div class="kicker" style="color:var(--nba)">Dec 15, 2026</div><p>Most players who signed as free agents this offseason become eligible to be traded.</p></div>
    <div class="card"><div class="kicker" style="color:var(--nba)">Jan 10, 2027</div><p>Non-guaranteed contracts become fully guaranteed for the season; teams often waive or trade them just before.</p></div>
    <div class="card"><div class="kicker" style="color:var(--nba)">End of regular season</div><p>Tax bills are calculated on each team's payroll on the final day of the regular season.</p></div>
  </div>
  <h2>Tax line watch</h2><p class="note">Teams within $8M below the tax line up to just past the 2nd apron. Bars show distance from the $200.428M tax line. The estimated tax is what a team saves by getting under the line; the last column is how much salary it would have to shed.</p>
  <div class="tablewrap"><table class="tb"><thead><tr><th>Team</th><th>Payroll</th><th>vs tax line</th><th style="text-align:left;width:32%">Position</th><th>Est. tax</th><th>Cut needed to duck tax</th></tr></thead><tbody>
  ${watch.map(t=>{const d=t.payroll-T.tax,bill=nbaTax(t.payroll,t.rep).bill;const w=Math.min(Math.abs(d)/25*50,50);return `<tr class="link" data-team="#nba-${t.id.toLowerCase()}"><td>${TL('nba',t)}</td><td>${fm(t.payroll)}</td><td class="${d>0?'neg':'pos'}">${fs(d,Math.abs(d)<1?2:1)}</td><td style="text-align:left"><div style="position:relative;height:12px;background:#eef1f5"><div style="position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#0f172a"></div><div style="position:absolute;top:0;bottom:0;${d>0?`left:50%;width:${w}%;background:#ea580c`:`right:50%;width:${w}%;background:#2563eb`}"></div></div></td><td>${bill?fm(bill)+(t.rep?'<sup>R</sup>':''):'—'}</td><td>${d>0?fm(d,2):'—'}</td></tr>`}).join('')}</tbody></table></div>
  <h2>Hard-cap squeeze</h2><p class="note">Teams that have triggered a hard cap this season and how much room they have under it. They can't exceed it for any reason this season.</p>
  <div class="tablewrap"><table class="tb"><thead><tr><th>Team</th><th>Hard cap</th><th>Payroll</th><th>Room</th><th style="text-align:left">Why</th></tr></thead><tbody>${hcTeams.map(t=>`<tr class="link" data-team="#nba-${t.id.toLowerCase()}"><td>${TL('nba',t)}</td><td>${t.hc.level==='a1'?'1st apron':'2nd apron'}</td><td>${fm(t.payroll)}</td><td class="${t.room<5?'neg':'pos'}">${fm(t.room,2)}</td><td style="text-align:left;white-space:normal;font-family:var(--body);font-size:12.5px;color:var(--ink2)">${esc(t.hc.why)}</td></tr>`).join('')}</tbody></table></div>
  <h2>Biggest expiring contracts</h2><p class="note">The largest 2026-27 salaries with no 2027-28 salary listed. Expiring deals are the usual currency at the deadline: they match salary now and clear books next summer.</p>
  <div class="tablewrap"><table class="tb"><thead><tr><th>Player</th><th>Team</th><th>Age</th><th>2026-27 salary</th><th>Team status</th></tr></thead><tbody>${exp.map(e=>`<tr class="link" data-team="#nba-${e.t.id.toLowerCase()}"><td>${esc(e.n)}</td><td style="font-family:var(--body)">${TL('nba',e.t)}</td><td>${e.age}</td><td>${fm(e.s,2)}</td><td><span class="chip" style="background:${TIER_COL[nbaTier(e.t.payroll).k]}">${nbaTier(e.t.payroll).short}</span></td></tr>`).join('')}</tbody></table></div>

  <div class="tablewrap"><table class="tb"><thead><tr><th>Team</th><th>2027 space</th><th>2027 effective</th><th>Signed for 2027</th><th>2026 space (rollover)</th></tr></thead><tbody>${crunch.map(t=>`<tr class="link" data-team="#nfl-${t.id.toLowerCase()}"><td>${TL('nfl',t)}</td><td class="${cls(t.space27)}">${fm(t.space27)}</td><td class="${cls(t.eff27)}">${fm(t.eff27)}</td><td>${t.n27}</td><td>${fm(t.space)}</td></tr>`).join('')}</tbody></table></div>

function viewCompare(){const rows=[['Cap type','<b>Soft cap.</b> Teams may exceed it using exceptions and Bird rights; the aprons act as practical ceilings.','<b>Hard cap.</b> No team may exceed its adjusted cap at any point in the league year.'],['Current number','$164.961M cap · $200.428M tax · $209.015M / $221.686M aprons (2026-27)','$301.2M base cap (2026); $327M projected for 2027'],['Roster size','15 standard + up to 3 two-way contracts','53-man roster + practice squad; top-51 rule in offseason'],['Cap per roster spot','≈ $11.0M per standard spot','≈ $5.7M per 53-man spot'],['Penalty for spending','Luxury tax by bracket; repeater rates; apron restrictions and frozen draft picks','None allowed; the cost is pushed into future years via proration'],['Guarantees','Contracts are generally fully guaranteed','Partial guarantees are the norm; cut players leave dead money'],['Keeping your stars','Bird rights let a team exceed the cap to re-sign its own players','Franchise / transition tags buy one year at a set price'],['Moving money in time','Little: salary counts the season it\'s paid; stretch provision spreads waived salary','Lots: bonus proration, restructures, void years, rollover, post-June 1 cuts'],['Floor','Minimum team salary $148.465M','90% cash-spending minimum over multi-year periods'],['Trade deadline','Feb 11, 2027','Nov 10, 2026 (passed)']];

  <table class="cmp"><thead><tr><th></th><th style="color:var(--nba)">NBA</th><th style="color:var(--nfl)">NFL</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>`;}

/* ================= footer / sources ================= */
const SOURCES=[['NBA sets Salary Cap for 2026-27 — NBA Communications','https://pr.nba.com/2026-27-salary-cap/'],['NBA team cap sheets and rosters, Nov 2026 — JJNBA','https://jjnba.com/'],['NBA teams with hard caps for 2026-27 — Hoops Rumors via Yardbarker','https://www.yardbarker.com/nba/articles/nba_teams_with_hard_caps_for_202627/s1_14822_44048142'],['NBA trade rules and 2026-27 salary matching — Legion Report','https://legionreport.com/nba-trade-rules-explained/'],['2027 NBA trade deadline set for Feb 11 — Hoops Rumors via Yardbarker','https://www.yardbarker.com/nba/articles/2027_nba_trade_deadline_set_for_february_11/s1_14822_44140863'],['Tax aprons glossary — Hoops Rumors','https://www.hoopsrumors.com/2025/01/hoops-rumors-glossary-tax-aprons-2.html'],['Luxury tax penalties glossary — Hoops Rumors','https://www.hoopsrumors.com/2024/11/hoops-rumors-glossary-luxury-tax-penalties-4.html'],['NFL announces 2026 salary cap of $301.2M — NFL.com','https://amp.nfl.com/news/nfl-announces-2026-salary-cap-set-at-301-2-million-per-team'],['NFL salary cap space, 2026 & 2027 — Over The Cap','https://overthecap.com/salary-cap-space'],['NFL team salary cap pages — Over The Cap','https://overthecap.com/salary-cap/detroit-lions'],['2026-27 NFL important dates — NFL.com','https://www.nfl.com/_amp/2026-27-national-football-league-important-dates'],['2026 franchise & transition tag values — NBC Sports','https://www.nbcsports.com/nfl/profootballtalk/rumor-mill/news/nfl-announces-franchise-tag-transition-tag-values-for-2026'],['NFL CBA Art. 12: minimum cash spending — Over The Cap','https://overthecap.com/collective-bargaining-agreement/article/12/section/9/(b)/']];
$('#foot').innerHTML=`<p><b>About the data.</b> NBA payrolls and rosters come from JJNBA team cap sheets as of ${DATA.asof}; tax bills are estimates assuming payroll holds through season's end. Hard-cap status comes from JJNBA's tracking and a July 2026 Hoops Rumors report. NFL team figures and player cap hits come from Over The Cap as of ${DATA.asof}; 2027 figures are projections. NFL player tables show the top cap hits, not every contract. Trackers count holds, incentives and dead money slightly differently, so small differences from other sites are normal.</p><h3 style="margin-top:16px">Sources</h3><ol>${SOURCES.map(([t,u])=>`<li><a href="${u}">${esc(t)}</a></li>`).join('')}</ol>`;

/* ================= night mode ================= */
function syncThemeBtn(){const d=isDark(),b=$('#themeBtn');b.setAttribute('aria-label',d?'Switch to day mode':'Switch to night mode');b.title=d?'Day mode':'Night mode'}
$('#themeBtn').onclick=()=>{const d=!isDark();document.documentElement.dataset.theme=d?'dark':'light';try{localStorage.setItem('cm-theme',d?'dark':'light')}catch(e){}
  syncThemeBtn();const y=scrollY;route();scrollTo(0,y)};
syncThemeBtn();

/* ================= router ================= */
const jump=$('#jump');
jump.innerHTML=`<option value="">Jump to a team…</option><optgroup label="NBA">${NBA.map(t=>`<option value="nba-${t.id.toLowerCase()}">${t.name}</option>`).join('')}</optgroup><optgroup label="NFL">${NFL.map(t=>`<option value="nfl-${t.id.toLowerCase()}">${t.name}</option>`).join('')}</optgroup>`;
jump.onchange=()=>{if(jump.value)go(jump.value)};
function route(){if(timer){clearInterval(timer);timer=null}hideTip();closeTerm();
  const h=keyFromPath();let view='home',team=null,lg=null;
  const m=h.match(/^(nba|nfl)-([a-z]+)$/);
  if(m){lg=m[1];team=(lg==='nba'?nbaById:nflById)[m[2].toUpperCase()];view=team?lg+'team':'home'}
  else if(['nba','nfl','trade','deadline','compare','glossary','home'].includes(h))view=h;
  document.body.className=view.startsWith('nba')||view==='trade'?'nba':view.startsWith('nfl')?'nfl':'';
  const navKey=view==='nbateam'?'nba':view==='nflteam'?'nfl':view;$$('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===navKey));
  jump.value=team?h:'';
  const app=$('#app');
  if(view==='home'){app.innerHTML=viewHome();mountHome()}
  else if(view==='nba'){app.innerHTML=viewNBA();mountNBA()}
  else if(view==='nfl'){app.innerHTML=viewNFL();mountNFL()}
  else if(view==='nbateam'){app.innerHTML=viewNbaTeam(team);mountNbaTeam(team);document.title=team.name+' Salary Cap 2026-27 — Payroll & Contracts | Cap Mechanics'}
  else if(view==='nflteam'){app.innerHTML=viewNflTeam(team);document.title=team.name+' Salary Cap 2026 — Cap Space & Dead Money | Cap Mechanics'}
  else if(view==='trade'){app.innerHTML=viewTrade();mountTrade()}
  else if(view==='deadline'){app.innerHTML=viewDeadline();startCountdown()}
  else if(view==='compare'){app.innerHTML=viewCompare()}
  else if(view==='glossary'){app.innerHTML=viewGlossary()}
  if(!team)document.title=({nba:'NBA Salary Cap 2026-27: All 30 Team Payrolls — Cap Mechanics',nfl:"NFL Salary Cap 2026: All 32 Teams' Cap Space — Cap Mechanics",trade:'NBA Trade Machine 2026-27 — Cap Mechanics',deadline:'NBA Trade Deadline Tracker 2027 — Cap Mechanics',compare:'NBA vs NFL Salary Cap Compared — Cap Mechanics',glossary:'Salary Cap Glossary: NBA & NFL Cap Terms Explained — Cap Mechanics'})[view]||'Cap Mechanics — NBA & NFL Salary Cap Explorer';
  $$('#app tr[data-team]').forEach(el=>el.onclick=e=>{if(!e.target.closest('a'))go(el.dataset.team)});
  scrollTo(0,0);}
if(/^#(home|nba|nfl|trade|deadline|compare|glossary|(nba|nfl)-[a-z]+)$/i.test(location.hash))history.replaceState(null,'',P(location.hash.slice(1)));
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="/"]');if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||a.target)return;e.preventDefault();const u=a.getAttribute('href');if(u!==location.pathname)history.pushState(null,'',u);route()});
addEventListener('popstate',route);route();
</script>
</body>
</html>
